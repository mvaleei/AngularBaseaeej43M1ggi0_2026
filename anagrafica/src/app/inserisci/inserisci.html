<div style="background-color: yellow; width: 80%;">
    <h3>Componente per inserire una nuova anagrafica</h3>
    <table>
        <tr>
            <td><label for="">Nominativo</label></td>
            <td>
                <input type="text" [(ngModel)]="nominativo">
            </td>
        </tr>
        <tr>
            <td><label for="">Anno di nascita</label></td>
            <td>
                <input type="number" [(ngModel)]="annoNascita">
            </td>
        </tr>
        <tr>
            <td><label for="">Interno</label></td>
            <td>
                <input type="text" [(ngModel)]="interno">
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <button (click)="inviaNuovo()">Conferma inserimento</button>
            </td>
        </tr>
    </table>
</div>
